# Render Blueprint: one Go web service + one Postgres, both on the smallest
# paid plan so nothing sleeps. Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: mama-server
    runtime: go
    region: virginia # closest US region to Caracas; can't change after creation
    plan: 0.5c-512mb # smallest paid web plan (free sleeps)
    branch: main
    rootDir: server
    buildCommand: go build -o bin/server ./cmd/server
    startCommand: ./bin/server
    healthCheckPath: /health
    autoDeployTrigger: commit # deploy every push to main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mama-db
          property: connectionString # private-network URL
      # Offline emergency channel (#55, #57): off unless set to "true" in the
      # dashboard (sync: false keeps Blueprint syncs from overwriting it). When on,
      # the server also needs EMERGENCY_ED25519_SEED and
      # EMERGENCY_X25519_PRIVATE_KEY set in the dashboard (README "Secrets").
      - key: EMERGENCY_OFFLINE_ENABLED
        sync: false
      # Public origin Twilio calls for the inbound SMS webhook (#58), e.g.
      # https://mama-server.onrender.com. Set it in the dashboard with the flag;
      # unset, POST /sms/inbound/twilio answers 503. TWILIO_AUTH_TOKEN (README
      # "Secrets") also verifies that webhook.
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: mama-db
    region: virginia # must match the web service for the private network
    plan: 0.1c-256mb # smallest paid Postgres plan (free expires)
    diskSizeGB: 1 # minimum; Basic plans default to 15 GB, billed separately
    databaseName: mama
    user: mama
    # ipAllowList omitted: external connections allowed (password-protected)
    # so teammates can psql in with the External Database URL.
