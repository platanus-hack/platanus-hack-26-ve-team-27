<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff}
.row{display:flex;gap:0}
.cell{width:120px;height:120px;display:flex;align-items:center;justify-content:center}
.ic{position:relative;overflow:hidden;background:#EFFE00}
.ic img{position:absolute;display:block}
.c72{width:72px;height:72px}.c48{width:48px;height:48px}
.circle{border-radius:50%}.sq{border-radius:20%}
.c72 img{width:81.7px;left:-5.2px;top:0.3px}
.c48 img{width:54.5px;left:-3.5px;top:0.2px}
</style></head><body>
<div class="row">
<div class="cell"><div class="ic c72 circle"><img src="../svg/sticker-full-nocircle.svg"></div></div>
<div class="cell"><div class="ic c72 sq"><img src="../svg/sticker-full-nocircle.svg"></div></div>
<div class="cell"><div class="ic c48 circle"><img src="../svg/sticker-full-nocircle.svg"></div></div>
<div class="cell"><div class="ic c48 sq"><img src="../svg/sticker-full-nocircle.svg"></div></div>
</div>
<div class="row">
<div class="cell"><div class="ic c72 circle"><img src="../svg/sticker-minA-nocircle.svg"></div></div>
<div class="cell"><div class="ic c72 sq"><img src="../svg/sticker-minA-nocircle.svg"></div></div>
<div class="cell"><div class="ic c48 circle"><img src="../svg/sticker-minA-nocircle.svg"></div></div>
<div class="cell"><div class="ic c48 sq"><img src="../svg/sticker-minA-nocircle.svg"></div></div>
</div>
<div class="row">
<div class="cell"><div class="ic c72 circle"><img src="../svg/sticker-minB-nocircle.svg"></div></div>
<div class="cell"><div class="ic c72 sq"><img src="../svg/sticker-minB-nocircle.svg"></div></div>
<div class="cell"><div class="ic c48 circle"><img src="../svg/sticker-minB-nocircle.svg"></div></div>
<div class="cell"><div class="ic c48 sq"><img src="../svg/sticker-minB-nocircle.svg"></div></div>
</div>
</body></html>
