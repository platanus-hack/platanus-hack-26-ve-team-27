<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAMÁ: llamada WebRTC (respaldo)</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
    main { max-width: 32rem; margin: 0 auto; }
    code { font-size: 0.9em; }
    .warn { padding: 12px; border: 1px solid #c60; border-radius: 8px; }
  </style>
</head>
<body>
<main>
  <h1>Llamada de respaldo (WebRTC)</h1>
  <p>Si la llamada a +58 no entra, "Mamá" habla por el navegador con el mismo agente de ElevenLabs.
     Toca el botón de abajo y permite el micrófono.</p>
  <p id="status"></p>
</main>
<script>
  // Spike #11 fallback. The agent id comes from ?agent=agent_..., so no id is
  // committed. The agent must be public (no auth) for the widget to connect.
  (function () {
    var agent = new URLSearchParams(location.search).get("agent") || "";
    var status = document.getElementById("status");
    if (!/^agent_[A-Za-z0-9]+$/.test(agent)) {
      status.className = "warn";
      status.textContent = "Falta el agente: abre esta página con ?agent=<ELEVENLABS_AGENT_ID>.";
      return;
    }
    var widget = document.createElement("elevenlabs-convai");
    widget.setAttribute("agent-id", agent);
    document.body.appendChild(widget);
    status.textContent = "Agente " + agent + " cargado.";
  })();
</script>
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed@0.19.0" async type="text/javascript"></script>
</body>
</html>
